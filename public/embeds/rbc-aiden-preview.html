<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>RBC public product preview</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10223a url('/experience/rbc-aiden-public-poster.jpg') center/cover no-repeat}
    video-js,.video-js{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;padding:0!important;background:transparent!important}
    .video-js{opacity:0}.ready .video-js{opacity:1}.video-js .vjs-tech{object-fit:cover}
    .vjs-control-bar,.vjs-big-play-button,.vjs-dock-text,.vjs-loading-spinner,.vjs-modal-dialog,.vjs-text-track-display,.vjs-error-display{display:none!important}
  </style>
</head>
<body>
  <!-- Official RBC/Brightcove public video. Decorative muted preview only.
       The portfolio's experience dialog retains the full controlled player.
       Kept in an opaque sandboxed iframe so provider scripts cannot access the parent. -->
  <script src="https://players.brightcove.net/6021289101001/eY0NaFfEF_default/index.min.js"></script>
  <script>
    if (typeof bc === 'function') {
      const element = document.createElement('video-js');
      element.setAttribute('data-account', '6021289101001');
      element.setAttribute('data-player', 'eY0NaFfEF');
      element.setAttribute('data-embed', 'default');
      element.setAttribute('data-video-id', '6089356568001');
      element.setAttribute('muted', '');
      element.setAttribute('playsinline', '');
      element.setAttribute('loop', '');
      element.setAttribute('tabindex', '-1');
      document.body.appendChild(element);
      const player = bc(element, { autoplay: 'muted', muted: true, loop: true, playsinline: true, preload: 'auto' });
      player.ready(function () {
        this.controls(false);
        this.muted(true);
        this.loop(true);
      });
      player.on('playing', function () { document.body.classList.add('ready'); });
      player.on('error', function () { document.body.classList.remove('ready'); });
    }
  </script>
</body>
</html>
